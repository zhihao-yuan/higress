admin:
  access_log_path: /dev/null
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 18080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                codec_type: AUTO
                stream_idle_timeout: 90s
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: [ "*" ]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: fixture
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: ai-token-ratelimit
                        vm_config:
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: /etc/envoy/wasm/plugin.wasm
                        configuration:
                          "@type": type.googleapis.com/google.protobuf.StringValue
                          value: '{"rule_name":"ai-token-json-repro","rule_items":[{"limit_by_per_header":"x-fixture-user","limit_keys":[{"key":"regexp:^u-","token_per_hour":1000000000}]},{"limit_by_header":"x-shared-group","limit_keys":[{"key":"shared","token_per_hour":1000000000}]}],"redis":{"service_name":"redis.static","service_port":6379,"timeout":10000},"rejected_code":429,"rejected_msg":"Too many AI token requests"}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: fixture
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: fixture
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: fixture, port_value: 9090 }
    - name: "outbound|6379||redis.static"
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: "outbound|6379||redis.static"
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: redis, port_value: 6379 }
